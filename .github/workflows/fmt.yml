name: Check formatting

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "**.nix"
      - .github/workflows/fmt.yml

  pull_request:
    branches:
      - master
    paths:
      - "**.nix"
      - .github/workflows/fmt.yml

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:     
      - name: Checkout repository
        uses: actions/checkout@v7
            
      - name: Prelude
        uses: ./.github/actions/prelude

      - name: Run formatter check
        run: nix fmt -- --ci
